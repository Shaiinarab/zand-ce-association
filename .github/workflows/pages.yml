name: Build and deploy Zand CE Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install Go dependencies
        run: go mod download
      - name: Validate content
        run: npm run check
      - name: TypeScript 7 validation
        run: npm run typecheck
      - name: Build TypeScript and static site
        run: |
          npm run build:assets
          go run ./cmd/export -out dist -base-path "${{ steps.pages.outputs.base_path }}" -site-url "${{ steps.pages.outputs.base_url }}"
      - name: Verify generated site
        run: |
          set -eu
          for path in \
            dist/index.html \
            dist/programs/index.html \
            dist/programs/crypto-hype/index.html \
            dist/terminal/index.html \
            dist/docs/workshops/software-engineering/index.html \
            dist/docs/index.html \
            dist/roadmap/index.html \
            dist/sitemap.xml \
            dist/robots.txt \
            dist/assets/app.js
          do
            if [ ! -s "$path" ]; then
              echo "::error::Missing or empty required generated file: $path"
              exit 1
            fi
          done
          # .nojekyll is deliberately empty; verify existence, not file size.
          test -f dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
