name: Quality checks

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download Go modules
        run: go mod download
      - name: Check content inventory
        run: npm run check
      - name: TypeScript 7 typecheck
        run: npm run typecheck
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Build browser assets and static website
        run: npm run build:assets && go run ./cmd/export -out dist
      - name: Smoke test generated routes
        run: |
          test -s dist/index.html
          test -s dist/programs/index.html
          test -s dist/programs/crypto-hype/index.html
          test -s dist/terminal/index.html
          test -s dist/docs/workshops/software-engineering/index.html
          test -s dist/docs/index.html
          test -s dist/roadmap/index.html
          test -s dist/docs/02-workshops/path-software-engineering/index.html
          test -s dist/assets/site.css
          test -s dist/assets/app.js
